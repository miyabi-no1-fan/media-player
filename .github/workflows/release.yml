name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  PROJECT: ${{ github.event.repository.name }}

jobs:
  ubuntu_build:
    # https://github.blog/changelog/2026-09-17-ubuntu-26-generally-available-and-latest-migration
    # should be `ubuntu-latest` after November 19, 2026.
    runs-on: ubuntu-26.04
    env:
      ARCHIVE: ${{ github.event.repository.name }}-${{ github.ref_name }}-ubuntu-x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            wget python3 build-essential pkg-config cmake make \
            libwayland-dev wayland-protocols libxkbcommon-dev xorg-dev \
            libasound2-dev libpulse-dev libjack-jackd2-dev \
            libvulkan-dev libavfilter-dev libavformat-dev \
            libavcodec-dev libswresample-dev libavutil-dev
          wget https://sdk.lunarg.com/sdk/download/1.4.350.0/linux/vulkansdk-linux-x86_64-1.4.350.0.tar.xz
          tar -xf vulkansdk-linux-x86_64-1.4.350.0.tar.xz
          ln -s 1.4.350.0 vulkansdk

      - name: Build
        shell: bash
        run: |
          source vulkansdk/setup-env.sh
          ./build.py

      - name: Package
        run: |
          mkdir "$ARCHIVE"
          cp "build/$PROJECT" "$ARCHIVE"
          tar -czf "$ARCHIVE.tar.gz" "$ARCHIVE"
          sha256sum "$ARCHIVE.tar.gz" > "$ARCHIVE.tar.gz.sha256"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: dist-ubuntu
          path: |
            ${{ env.ARCHIVE }}.tar.gz
            ${{ env.ARCHIVE }}.tar.gz.sha256

  archlinux_build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      ARCHIVE: ${{ github.event.repository.name }}-${{ github.ref_name }}-archlinux-x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm \
            base-devel git pkgconf cmake make shaderc python llvm clang \
            wayland wayland-protocols libxkbcommon libx11 libxrandr libxinerama libxcursor libxi \
            alsa-lib libpulse jack2 \
            vulkan-headers vulkan-icd-loader ffmpeg

      - name: Build
        run: ./build.py

      - name: Package
        run: |
          mkdir "$ARCHIVE"
          cp "build/$PROJECT" "$ARCHIVE"
          tar -czf "$ARCHIVE.tar.gz" "$ARCHIVE"
          sha256sum "$ARCHIVE.tar.gz" > "$ARCHIVE.tar.gz.sha256"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: dist-arch
          path: |
            ${{ env.ARCHIVE }}.tar.gz
            ${{ env.ARCHIVE }}.tar.gz.sha256

  windows_build:
    runs-on: windows-latest
    env:
      ARCHIVE: ${{ github.event.repository.name }}-${{ github.ref_name }}-windows-x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full-shared.7z" -OutFile ffmpeg.7z
          7z x ffmpeg.7z -oC:\ffmpeg
          $dir = (Get-ChildItem C:\ffmpeg -Directory)[0].FullName
          echo "$dir\bin" >> $env:GITHUB_PATH
          echo "FFMPEG_DIR=$dir" >> $env:GITHUB_ENV
          echo "INCLUDE=$dir\include" >> $env:GITHUB_ENV
          echo "LIB=$dir\lib" >> $env:GITHUB_ENV

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          winget install --id KhronosGroup.VulkanSDK -e --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
          $sdk = Get-ChildItem C:\VulkanSDK -Directory |
                 Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          "VULKAN_SDK=$($sdk.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$($sdk.FullName)\Bin"        | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build
        shell: cmd
        env:
          CMAKE_GENERATOR: Ninja
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VSROOT=%%i"
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          python build.py

      - name: Package
        shell: bash
        run: |
          mkdir -p "$ARCHIVE"
          cp "build/$PROJECT" "$ARCHIVE/"
          tar -czf "$ARCHIVE.tar.gz" "$ARCHIVE"
          sha256sum "$ARCHIVE.tar.gz" > "$ARCHIVE.tar.gz.sha256"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: |
            ${{ env.ARCHIVE }}.tar.gz
            ${{ env.ARCHIVE }}.tar.gz.sha256


  release:
    needs: [ubuntu_build, archlinux_build,windows_build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" \
          dist/*.tar.gz dist/*.tar.gz.sha256 --clobber
